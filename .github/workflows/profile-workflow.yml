
# Copy into your profile repository as:
# .github/workflows/profile-workflow.yml
#
# Embed in README.md:
# <img src="koi/koi.gif" width="256" alt="My koi">

name: Koi

on:
  schedule:
    # Just after midnight UTC
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - .github/workflows/profile-workflow.yml

permissions:
  contents: write

# Prevent simultaneous Koi workflow runs
concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - name: Commit and push Koi with automatic rebase retry
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "Koi is unchanged. Nothing to commit."
            exit 0
          fi

          git commit --quiet -m "koi: draw the day's koi"

          MAX_RETRIES=3
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            echo "Push attempt $ATTEMPT of $MAX_RETRIES"

            if git push origin "HEAD:refs/heads/${BRANCH_NAME}"; then
              echo "Koi successfully pushed!"
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_RETRIES" ]; then
              echo "Push failed after $MAX_RETRIES attempts."
              exit 1
            fi

            echo "Push rejected. Fetching latest remote changes..."

            git fetch origin "$BRANCH_NAME"

            echo "Rebasing Koi commit onto latest remote branch..."

            if ! git rebase "origin/${BRANCH_NAME}"; then
              echo "Rebase conflict detected. Aborting rebase."
              git rebase --abort
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
